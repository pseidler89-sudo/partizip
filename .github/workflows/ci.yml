name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partizip
          POSTGRES_PASSWORD: partizip
          POSTGRES_DB: partizip_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U partizip -d partizip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Schema-Drift-Check (M4)
        working-directory: app
        run: |
          npm run db:generate
          if ! git diff --quiet -- ../db/migrations || [ -n "$(git status --porcelain -- ../db/migrations)" ]; then
            echo "Schema und Migrationen driften — db:generate ausführen und committen"
            git status --porcelain -- ../db/migrations
            exit 1
          fi

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # Smoke: Migrationskette wendet sauber an UND Seed läuft idempotent durch
      # (db:migrate/db:seed lesen DATABASE_URL). Die Tests migrieren ihre DB
      # zusätzlich selbst — dieser Schritt verifiziert gezielt Migrate + Seed.
      - name: Migrate + Seed (smoke)
        working-directory: app
        env:
          DATABASE_URL: postgres://partizip:partizip@localhost:5433/partizip_test
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Test
        working-directory: app
        env:
          DATABASE_URL_TEST: postgres://partizip:partizip@localhost:5433/partizip_test
          SMTP_URL: smtp://127.0.0.1:1025
          EMAIL_FROM: test@partizip.example
        run: npm test

      - name: Build
        working-directory: app
        env:
          # Build braucht keine echte DB, aber Next.js erwartet die Variable
          DATABASE_URL: postgres://partizip:partizip@localhost:5433/partizip_test
        run: npm run build

  # Eigenständiger Job: beweist die ZWINGENDE Prod-Reihenfolge db:seed:regions VOR
  # db:migrate für ein UPGRADE einer Bestands-DB (der reale Prod-Ausfall-Pfad). Der
  # ci-Job oben deckt nur den Fresh-Pfad ab. Getrennter Job + eigene DB → bricht den
  # bestehenden Job nicht und läuft parallel. Logik in scripts/test-upgrade-path.ts.
  upgrade-path:
    name: Upgrade-Pfad (seed vor migrate)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partizip
          POSTGRES_PASSWORD: partizip
          POSTGRES_DB: partizip_upgrade_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U partizip -d partizip_upgrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Migrationen bis 0023 → Bestands-Fachzeilen → db:seed:regions → 0024/0025.
      # Muss grün durchlaufen (0 NULL region_id auf allen Fachtabellen).
      - name: Upgrade-Pfad-Test
        working-directory: app
        env:
          DATABASE_URL: postgres://partizip:partizip@localhost:5433/partizip_upgrade_test
        run: npm run test:upgrade

  # Eigenständiger Job (Issue #60): prüft das GERENDERTE DOM von vier
  # unangemeldet erreichbaren Seiten mit axe — Kontraste, Landmarks,
  # Formular-Labels, Heading-Reihenfolge. Das ergänzt das statische
  # jsx-a11y-Lint-Gate im ci-Job, das genau diese Klasse von Verstößen
  # prinzipbedingt nicht sehen kann (sie entsteht erst beim Rendern).
  #
  # REICHWEITE — bitte nicht überdehnen: geprüft werden ausschließlich die
  # anonymen Sichten /, /umfragen, /anliegen und /anmelden. Die eigentlichen
  # Beteiligungsflüsse (/umfrage/[id], /mitmachen, /konto, /verifizieren,
  # Admin) sind NICHT abgedeckt, ebenso wenig Tastaturbedienung, Fokusführung
  # und alles, was erst nach einer Interaktion entsteht. Gegenüber Kommunen
  # trägt dieser Job also genau diese vier Seiten und die von axe automatisiert
  # entscheidbaren Regeln — keine Aussage über die Anwendung als Ganzes.
  # Ausweitung auf die Kernflüsse ist ein eigener Schritt.
  #
  # Getrennter Job + eigene Service-DB, dem Muster von upgrade-path folgend →
  # bricht die bestehenden Jobs nicht und läuft parallel.
  #
  # ZENTRAL: der Server MUSS mit PILOT_TENANT_SLUG=taunusstein starten. Die
  # Tenant-Auflösung ist host-basiert (app/src/middleware.ts); localhost ist eine
  # HAUPT-Domain und liefert ohne diese Variable die neutrale Landing-Page statt
  # der Tenant-App. Ein a11y-Lauf dagegen wäre grün und wertlos. Der Schritt
  # "a11y-Lauf" ruft deshalb scripts/a11y-preflight.ts VOR pa11y auf: HTTP-Poll
  # als Readiness (kein sleep), 200-Prüfung aller vier Seiten, eine harte
  # Assertion, dass /umfragen den Wortlaut einer geseedeten Umfrage aus
  # db/seeds/polls.json enthält, und eine ebenso harte Assertion, dass die
  # Stylesheets der Seiten wirklich ausgeliefert werden (ohne CSS findet axe
  # keine visuellen Verstöße mehr — der Lauf wäre erneut grün und wertlos).
  # Schlägt eine davon fehl, bricht der Job ab.
  #
  # `npm run a11y` startet danach ZWEI pa11y-ci-Läufe mit unterschiedlichen
  # Configs. Warum zwei nötig sind — ein einzelner Lauf kann die unentscheidbaren
  # Kontrastfälle des Verlaufs-Heros nicht dämpfen, ohne gleichzeitig belegte
  # Verstöße wie duplicate-id-aria stumm zu schalten — steht ausführlich im
  # Kopfkommentar von app/.pa11yci.js.
  a11y:
    name: a11y (axe) — Kernseiten
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partizip
          POSTGRES_PASSWORD: partizip
          POSTGRES_DB: partizip_a11y_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U partizip -d partizip_a11y_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://partizip:partizip@localhost:5433/partizip_a11y_test
      PILOT_TENANT_SLUG: taunusstein
      # A11Y_BASE_URL ist die EINE Quelle: app/.pa11yci.js baut daraus die
      # pa11y-Ziele, scripts/a11y-preflight.ts importiert dieselbe Konstante.
      # PORT muss dazu passen — der Standalone-Server liest ihn.
      PORT: "3000"
      HOSTNAME: 127.0.0.1
      A11Y_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # Lädt zugleich das Chromium, das pa11y über Puppeteer startet.
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Die Seeds sind die Datengrundlage der geprüften Seiten UND der
      # Tenant-Assertion (db/seeds/polls.json).
      - name: Migrate + Seed
        working-directory: app
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        working-directory: app
        run: npm run build

      # `npm run start:standalone` statt `npm run start`: app/next.config.ts setzt
      # `output: "standalone"`, und Next 16 warnt ausdrücklich, dass `next start`
      # damit nicht unterstützt ist. Produktion fährt .next/standalone/server.js
      # (siehe Dockerfile, Stage `runner`) — der a11y-Job prüft damit denselben
      # Server wie die Kommunen ihn sehen. Das Skript kopiert vorher .next/static
      # und public neben server.js, genau wie das Dockerfile.
      #
      # Der Server läuft in einer EIGENEN Prozessgruppe (setsid) und meldet deren
      # PGID selbst. So beendet der Cleanup die ganze Gruppe (npm-Wrapper +
      # node-Server) statt nur des npm-Prozesses; ein `$!` des aufrufenden Shells
      # wäre je nach Job-Control nicht zuverlässig die PGID.
      # Auf Readiness wird hier NICHT gewartet — das macht der Preflight per
      # HTTP-Poll im nächsten Schritt (kein sleep als Synchronisation).
      - name: Server starten (Pilot-Tenant, Standalone wie in Produktion)
        working-directory: app
        run: |
          setsid bash -c 'echo $$ > /tmp/a11y-server.pgid; exec npm run start:standalone' \
            > /tmp/a11y-server.log 2>&1 < /dev/null &
          for _ in $(seq 1 100); do
            [ -s /tmp/a11y-server.pgid ] && break
            sleep 0.1
          done
          [ -s /tmp/a11y-server.pgid ] || { echo "Server-PGID wurde nicht geschrieben"; exit 1; }
          echo "Server-Prozessgruppe: $(cat /tmp/a11y-server.pgid)"

      - name: a11y-Lauf (Preflight + beide pa11y-ci-Läufe)
        working-directory: app
        run: npm run a11y

      - name: Server-Log (nur bei Fehlschlag)
        if: failure()
        run: tail -n 100 /tmp/a11y-server.log || true

      - name: Server beenden
        if: always()
        run: |
          if [ -f /tmp/a11y-server.pgid ]; then
            kill -TERM -"$(cat /tmp/a11y-server.pgid)" 2>/dev/null || true
          fi
